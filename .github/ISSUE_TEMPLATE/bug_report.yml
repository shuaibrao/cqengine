name: Bug report
description: Report reproducible incorrect CQEngine behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not disclose vulnerabilities here. Use the private reporting route in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: CQEngine version
      placeholder: 4.0.0
    validations:
      required: true
  - type: input
    id: java
    attributes:
      label: Java runtime
      description: Include vendor and full version from java -version.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproducer
    attributes:
      label: Minimal reproducer
      description: Provide a small test or repository and remove confidential data.
      render: java
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Relevant environment details
      description: Include the operating system and persistence or parser configuration when relevant.
