name: Release bundle

on:
  workflow_dispatch:
    inputs:
      version:
        description: Non-SNAPSHOT version to package (dispatch from the v<version> tag)
        required: true
        type: string
      centralPublishing:
        description: >-
          Central Portal hand-off: skip = signed bundle artifact only; user-managed =
          upload and wait for validation, publish manually in the Portal;
          automatic = upload and publish once validation passes (permanent)
        required: true
        type: choice
        default: skip
        options:
          - skip
          - user-managed
          - automatic

permissions:
  contents: read

concurrency:
  group: release-bundle-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify, sign, and hand off to Central
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    environment: maven-central

    steps:
      - name: Verify the run ref matches the release tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::version must use SemVer without a leading v"
            exit 1
          fi
          case "$RELEASE_VERSION" in
            *-SNAPSHOT) echo "::error::Maven Central does not accept snapshot releases"; exit 1 ;;
          esac
          if [ "$GITHUB_REF" != "refs/tags/v$RELEASE_VERSION" ]; then
            echo "::error::Release bundle for version $RELEASE_VERSION must run from tag v$RELEASE_VERSION, but this run is on $GITHUB_REF. Create the release tag and re-run this workflow with that tag selected as the ref."
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Verify Maven Central version is absent
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          url="https://repo1.maven.org/maven2/io/github/shuaibrao/cqengine/$RELEASE_VERSION/cqengine-$RELEASE_VERSION.pom"
          status=$(curl --proto '=https' --tlsv1.2 --silent --show-error --output /dev/null --write-out '%{http_code}' "$url")
          case "$status" in
            404) ;;
            200) echo "::error::io.github.shuaibrao:cqengine:$RELEASE_VERSION already exists in Maven Central"; exit 1 ;;
            *) echo "::error::could not prove Maven Central version absence (HTTP $status)"; exit 1 ;;
          esac

      - name: Verify committed qualification evidence and select the qualified commit
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          evidence="release-evidence/$RELEASE_VERSION"
          completion="$evidence/wrapper-completion.properties"
          readiness="$evidence/local-readiness-manifest.txt"
          if [ ! -f "$completion" ] || [ ! -f "$readiness" ]; then
            echo "::error::committed qualification evidence is missing under $evidence/ - run scripts/qualify-candidate.sh locally, commit its wrapper-completion.properties and local-readiness-manifest.txt there, then tag."
            exit 1
          fi
          grep -Fxq 'status=passed' "$completion" || { echo "::error::qualification completion record is not successful"; exit 1; }
          grep -Fxq 'validationStatus=passed' "$completion" || { echo "::error::qualification validation record is not successful"; exit 1; }
          grep -Fxq "coordinate=io.github.shuaibrao:cqengine:$RELEASE_VERSION" "$readiness" || {
            echo "::error::qualification evidence does not identify io.github.shuaibrao:cqengine:$RELEASE_VERSION"; exit 1; }
          source_commit=$(sed -n 's/^sourceCommit=//p' "$readiness")
          if [ "$(printf '%s\n' "$source_commit" | wc -l)" != 1 ] || [ -z "$source_commit" ]; then
            echo "::error::readiness manifest must contain exactly one sourceCommit"
            exit 1
          fi
          if ! grep -Fxq "sourceCommit=$source_commit" "$completion"; then
            echo "::error::completion and readiness evidence identify different commits"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$source_commit" "$GITHUB_SHA"; then
            echo "::error::qualified commit $source_commit is not an ancestor of the release tag"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/qualification"
          cp "$completion" "$readiness" "$RUNNER_TEMP/qualification/"
          echo "QUALIFIED_COMMIT=$source_commit" >> "$GITHUB_ENV"

      - name: Check out the exact qualified commit
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git checkout --detach "$QUALIFIED_COMMIT"
          configured_version=$(sed -n 's/^version=//p' gradle.properties)
          if [ "$RELEASE_VERSION" != "$configured_version" ]; then
            echo "::error::qualified commit declares version $configured_version, not $RELEASE_VERSION"
            exit 1
          fi

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          cache-read-only: "true"

      - name: Rebuild and verify the qualified publication
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >-
          ./gradlew
          check
          verifyPublishedJars
          verifyPublication
          consumerTest
          apiCompatibility
          baseline
          integrationTest
          jmhSmoke
          concurrencySmoke
          --no-daemon
          --dependency-verification strict
          --console=plain

      - name: Stage the committed qualification evidence for bundling
        run: |
          mkdir -p build/local-release-evidence/qualification
          cp "$RUNNER_TEMP/qualification/wrapper-completion.properties" \
             "$RUNNER_TEMP/qualification/local-readiness-manifest.txt" \
             build/local-release-evidence/qualification/

      - name: Import the protected signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::SIGNING_KEY is required in the maven-central environment"
            exit 1
          fi
          export GNUPGHOME="$RUNNER_TEMP/cqengine-gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s' "$SIGNING_KEY" | env -u SIGNING_KEY gpg --batch --import
          unset SIGNING_KEY
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Prepare signed Central Portal bundle from the exact rebuilt bytes
        env:
          CQENGINE_GPG_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          CQENGINE_GPG_PASSPHRASE: ${{ secrets.SIGNING_PASSWORD }}
        run: scripts/prepare-central-bundle.py

      - name: Retain signed bundle and verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cqengine-${{ inputs.version }}-central-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/central/
            build/reports/publication/
            build/reports/sbom/
          if-no-files-found: error
          retention-days: 30

      - name: Upload bundle to the Central Portal
        if: inputs.centralPublishing != 'skip'
        id: central-upload
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          RELEASE_VERSION: ${{ inputs.version }}
          CENTRAL_PUBLISHING: ${{ inputs.centralPublishing }}
        run: |
          if [ -z "$CENTRAL_TOKEN_USERNAME" ] || [ -z "$CENTRAL_TOKEN_PASSWORD" ]; then
            echo "::error::Central Portal upload requested but CENTRAL_TOKEN_USERNAME/CENTRAL_TOKEN_PASSWORD secrets are not set in the maven-central environment."
            exit 1
          fi
          case "$CENTRAL_PUBLISHING" in
            automatic) publishing_type=AUTOMATIC ;;
            *) publishing_type=USER_MANAGED ;;
          esac
          bundle="build/central/cqengine-$RELEASE_VERSION-central-bundle.zip"
          deployment_id=$(scripts/central-portal.sh upload \
            "$bundle" \
            "cqengine-$RELEASE_VERSION-$GITHUB_RUN_ID" \
            "$publishing_type")
          echo "Deployment id: $deployment_id (publishingType=$publishing_type)"
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"

      - name: Wait for the Central Portal outcome
        if: inputs.centralPublishing != 'skip'
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          DEPLOYMENT_ID: ${{ steps.central-upload.outputs.deployment_id }}
          RELEASE_VERSION: ${{ inputs.version }}
          CENTRAL_PUBLISHING: ${{ inputs.centralPublishing }}
        run: |
          expected_purl="pkg:maven/io.github.shuaibrao/cqengine@$RELEASE_VERSION"
          central_username=$CENTRAL_TOKEN_USERNAME
          central_password=$CENTRAL_TOKEN_PASSWORD
          unset CENTRAL_TOKEN_USERNAME CENTRAL_TOKEN_PASSWORD
          for attempt in $(seq 1 120); do
            response=$(CENTRAL_TOKEN_USERNAME="$central_username" \
              CENTRAL_TOKEN_PASSWORD="$central_password" \
              scripts/central-portal.sh status "$DEPLOYMENT_ID")
            state=$(python3 -c 'import json,sys; d=json.load(sys.stdin); s=d["deploymentState"]; p=d.get("purls", []); d.get("deploymentId") == sys.argv[1] or sys.exit("different deployment"); (not p or p == [sys.argv[2]]) or sys.exit("different coordinate"); print(s)' "$DEPLOYMENT_ID" "$expected_purl" <<<"$response")
            echo "[$attempt/120] deploymentState=$state"
            case "$state" in
              FAILED)
                printf '%s\n' "$response" | python3 -m json.tool >&2
                echo "::error::Central Portal validation failed; see the errors above."
                exit 1
                ;;
              VALIDATED)
                if [ "$CENTRAL_PUBLISHING" = user-managed ]; then
                  echo "Deployment validated. Publish it manually in the Central Portal UI (publishingType=USER_MANAGED)."
                  exit 0
                fi
                ;;
              PUBLISHING|PUBLISHED)
                echo "Deployment state $state - Central is publishing to Maven Central."
                exit 0
                ;;
              PENDING|VALIDATING) ;;
              *)
                echo "::error::unexpected Central deployment state: $state"
                exit 1
                ;;
            esac
            sleep 30
          done
          echo "::error::Timed out waiting for the Central Portal; check the deployment in the Portal UI."
          exit 1

      - name: Remove imported signing material
        if: always()
        run: |
          if [ -n "${GNUPGHOME:-}" ] && [[ "$GNUPGHOME" == "$RUNNER_TEMP"/* ]]; then
            gpgconf --kill all || true
            rm -rf -- "$GNUPGHOME"
          fi
