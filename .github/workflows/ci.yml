name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Java 21 and 25
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          # formatRatchetCheck diffs maintainer-changed lines against the upstream commit, which a shallow
          # checkout does not contain.
          fetch-depth: 0

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Run CI verification and publication probes
        run: >-
          ./gradlew
          check
          verifyPublishedJars
          verifyPublication
          consumerTest
          apiCompatibility
          baseline
          :benchmarks:jmhJar
          --no-daemon
          --dependency-verification strict
          --console=plain

      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/reports/
            build/test-results/
          if-no-files-found: warn
          retention-days: 7
