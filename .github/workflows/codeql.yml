name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * 0"

permissions:
  # codeql-action reads workflow-run metadata to attach results to the right run; without it the analyze
  # step fails with "Resource not accessible by integration".
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Java analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended

      # --no-build-cache is required, not tidiness: CodeQL traces real compiler invocations, and a cache hit
      # produces the class files without running javac, leaving it with no source to analyse.
      - name: Compile production and test sources
        run: >-
          ./gradlew clean classes testClasses
          --no-daemon
          --no-build-cache
          --no-configuration-cache
          --dependency-verification strict
          --console=plain

      - name: Analyze
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: /language:java-kotlin
