name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * 0"

permissions:
  # codeql-action reads workflow-run metadata to attach results to the right run; without it the analyze
  # step fails with "Resource not accessible by integration".
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Java analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended

      # --no-build-cache is required, not tidiness: CodeQL traces real compiler invocations, and a cache hit
      # produces the class files without running javac, leaving it with no source to analyse.
      - name: Compile production and test sources
        run: >-
          ./gradlew clean classes testClasses
          --no-daemon
          --no-build-cache
          --no-configuration-cache
          --dependency-verification strict
          --console=plain

      - name: Analyze
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          category: /language:java-kotlin
