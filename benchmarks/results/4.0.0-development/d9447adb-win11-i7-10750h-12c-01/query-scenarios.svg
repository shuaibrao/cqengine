<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 592" role="img">
  <title>Indexed query scenarios on Java 25</title>
  <desc>Full result iteration over 10,000 records; parentheses show matches delivered per operation. Lower is better.</desc>
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; fill: #172033; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 13px; fill: #526071; }
    .category { font-size: 13px; font-weight: 600; }
    .series { font-size: 11px; fill: #526071; }
    .value { font-size: 11px; font-variant-numeric: tabular-nums; }
    .axis { font-size: 11px; fill: #657386; }
    .grid { stroke: #d8dee8; stroke-width: 1; }
  </style>
  <rect width="1160" height="592" fill="#ffffff"/>
  <text class="title" x="24" y="34">Indexed query scenarios on Java 25</text>
  <text class="subtitle" x="24" y="58">Full result iteration over 10,000 records; parentheses show matches delivered per operation. Lower is better.</text>
  <text class="subtitle" x="24" y="78">Logarithmic scale; labels show measured ns/op.</text>
  <rect x="24" y="91" width="14" height="10" rx="2" fill="#2563eb"/>
  <text class="series" x="44" y="100">Java 25</text>
  <line class="grid" x1="300.00" y1="112" x2="300.00" y2="544"/>
  <text class="axis" text-anchor="middle" x="300.00" y="564">100</text>
  <line class="grid" x1="518.33" y1="112" x2="518.33" y2="544"/>
  <text class="axis" text-anchor="middle" x="518.33" y="564">1,000</text>
  <line class="grid" x1="736.67" y1="112" x2="736.67" y2="544"/>
  <text class="axis" text-anchor="middle" x="736.67" y="564">10,000</text>
  <line class="grid" x1="955.00" y1="112" x2="955.00" y2="544"/>
  <text class="axis" text-anchor="middle" x="955.00" y="564">100,000</text>
  <text class="axis" text-anchor="middle" x="627.50" y="583">ns/op</text>
  <text class="category" text-anchor="end" x="286" y="134">Unique lookup: no match (0)</text>
  <rect x="300" y="120" width="74.60" height="14" rx="2" fill="#2563eb"/>
  <text class="value" x="380.60" y="131">219.6</text>
  <text class="category" text-anchor="end" x="286" y="170">Unique lookup: one match (1)</text>
  <rect x="300" y="156" width="77.00" height="14" rx="2" fill="#2563eb"/>
  <text class="value" x="383.00" y="167">225.3</text>
  <text class="category" text-anchor="end" x="286" y="206">Hash equality (2,500)</text>
  <rect x="300" y="192" width="503.55" height="14" rx="2" fill="#2563eb"/>
  <text class="value" x="809.55" y="203">20,250</text>
  <text class="category" text-anchor="end" x="286" y="242">Navigable range (16)</text>
  <rect x="300" y="228" width="235.35" height="14" rx="2" fill="#2563eb"/>
  <text class="value" x="541.35" y="239">1,197</text>
  <text class="category" text-anchor="end" x="286" y="278">Compound lookup (2,500)</text>
  <rect x="300" y="264" width="503.17" height="14" rx="2" fill="#2563eb"/>
  <text class="value" x="809.17" y="275">20,160</text>
  <text class="category" text-anchor="end" x="286" y="314">Standing query (1,250)</text>
  <rect x="300" y="300" width="426.29" height="14" rx="2" fill="#2563eb"/>
  <text class="value" x="732.29" y="311">8,964</text>
  <text class="category" text-anchor="end" x="286" y="350">Radix prefix (2,500)</text>
  <rect x="300" y="336" width="515.28" height="14" rx="2" fill="#2563eb"/>
  <text class="value" x="821.28" y="347">22,910</text>
  <text class="category" text-anchor="end" x="286" y="386">Reversed radix suffix (2,500)</text>
  <rect x="300" y="372" width="522.98" height="14" rx="2" fill="#2563eb"/>
  <text class="value" x="828.98" y="383">24,850</text>
  <text class="category" text-anchor="end" x="286" y="422">Inverted radix prefix (2,500)</text>
  <rect x="300" y="408" width="501.79" height="14" rx="2" fill="#2563eb"/>
  <text class="value" x="807.79" y="419">19,870</text>
  <text class="category" text-anchor="end" x="286" y="458">Suffix contains (2,500)</text>
  <rect x="300" y="444" width="518.11" height="14" rx="2" fill="#2563eb"/>
  <text class="value" x="824.11" y="455">23,610</text>
  <text class="category" text-anchor="end" x="286" y="494">Unindexed fallback (2,500)</text>
  <rect x="300" y="480" width="655.00" height="14" rx="2" fill="#2563eb"/>
  <text class="value" x="961.00" y="491">141,900</text>
</svg>
