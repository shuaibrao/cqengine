<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 448" role="img">
  <title>Normalized allocation on Java 25</title>
  <desc>Current-machine JMH gc.alloc.rate.norm; lower is better and zero allocation is not claimed.</desc>
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; fill: #172033; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 13px; fill: #526071; }
    .category { font-size: 13px; font-weight: 600; }
    .series { font-size: 11px; fill: #526071; }
    .value { font-size: 11px; font-variant-numeric: tabular-nums; }
    .axis { font-size: 11px; fill: #657386; }
    .grid { stroke: #d8dee8; stroke-width: 1; }
  </style>
  <rect width="1160" height="448" fill="#ffffff"/>
  <text class="title" x="24" y="34">Normalized allocation on Java 25</text>
  <text class="subtitle" x="24" y="58">Current-machine JMH gc.alloc.rate.norm; lower is better and zero allocation is not claimed.</text>
  <text class="subtitle" x="24" y="78">Logarithmic scale; labels show measured B/op.</text>
  <rect x="24" y="91" width="14" height="10" rx="2" fill="#2563eb"/>
  <text class="series" x="44" y="100">Java 25</text>
  <line class="grid" x1="300.00" y1="112" x2="300.00" y2="400"/>
  <text class="axis" text-anchor="middle" x="300.00" y="420">100</text>
  <line class="grid" x1="463.75" y1="112" x2="463.75" y2="400"/>
  <text class="axis" text-anchor="middle" x="463.75" y="420">1,000</text>
  <line class="grid" x1="627.50" y1="112" x2="627.50" y2="400"/>
  <text class="axis" text-anchor="middle" x="627.50" y="420">10,000</text>
  <line class="grid" x1="791.25" y1="112" x2="791.25" y2="400"/>
  <text class="axis" text-anchor="middle" x="791.25" y="420">100,000</text>
  <line class="grid" x1="955.00" y1="112" x2="955.00" y2="400"/>
  <text class="axis" text-anchor="middle" x="955.00" y="420">1,000,000</text>
  <text class="axis" text-anchor="middle" x="627.50" y="439">B/op</text>
  <text class="category" text-anchor="end" x="286" y="134">construct query</text>
  <rect x="300" y="120" width="101.38" height="14" rx="2" fill="#2563eb"/>
  <text class="value" x="407.38" y="131">416</text>
  <text class="category" text-anchor="end" x="286" y="170">create/read/close</text>
  <rect x="300" y="156" width="490.32" height="14" rx="2" fill="#2563eb"/>
  <text class="value" x="796.32" y="167">98,700</text>
  <text class="category" text-anchor="end" x="286" y="206">first result/close</text>
  <rect x="300" y="192" width="490.53" height="14" rx="2" fill="#2563eb"/>
  <text class="value" x="796.53" y="203">98,990</text>
  <text class="category" text-anchor="end" x="286" y="242">iterate/close</text>
  <rect x="300" y="228" width="490.44" height="14" rx="2" fill="#2563eb"/>
  <text class="value" x="796.44" y="239">98,870</text>
  <text class="category" text-anchor="end" x="286" y="278">size/close</text>
  <rect x="300" y="264" width="490.47" height="14" rx="2" fill="#2563eb"/>
  <text class="value" x="796.47" y="275">98,910</text>
  <text class="category" text-anchor="end" x="286" y="314">unindexed iterate/close</text>
  <rect x="300" y="300" width="182.68" height="14" rx="2" fill="#2563eb"/>
  <text class="value" x="488.68" y="311">1,305</text>
  <text class="category" text-anchor="end" x="286" y="350">singleton replace</text>
  <rect x="300" y="336" width="148.24" height="14" rx="2" fill="#2563eb"/>
  <text class="value" x="454.24" y="347">804</text>
</svg>
